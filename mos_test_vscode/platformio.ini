; PlatformIO project - XY-MOS PWM dimmer test
; VS Code + PlatformIO IDE: open THIS folder (the one containing this file).
;
; The sketch is board-agnostic: it uses analogWrite() on AVR and hardware
; LEDC PWM on ESP32. Pick the env for your board.

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; --- ESP32: uncomment this block and set default_envs = esp32dev above ---
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
